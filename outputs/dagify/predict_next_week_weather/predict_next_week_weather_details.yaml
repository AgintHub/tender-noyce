  clean_historical_weather_data:
    agent: false
    code_node_type: stub
    description: Retrieve historical weather data from a reliable source and transform
      it into a consistent, missing‑value‑free, and normalized dataset suitable for
      downstream machine learning training and forecasting.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GetHistoricalWeatherDataOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for get_historical_weather_data node outputs.\"\"\"\n    historical_dates:\
      \ List[str] = (\n        Field(..., description=\"List of dates (YYYY-MM-DD)\
      \ for which historical weather data is retrieved\")\n    )\n    historical_temperatures:\
      \ List[float] = (\n        Field(..., description=\"List of daily average temperatures\
      \ (in degrees Celsius) corresponding to the dates\")\n    )\n    historical_precipitation:\
      \ List[float] = (\n        Field(..., description=\"List of daily precipitation\
      \ amounts (in millimeters) corresponding to the dates\")\n    )\n    is_valid:\
      \ bool = (\n        Field(..., description=\"Whether the retrieved historical\
      \ data set passed basic integrity checks\")\n    )\n\n\nclass CleanHistoricalWeatherDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for clean_historical_weather_data node outputs.\"\"\
      \"\n    cleaned_record_count: int = (\n        Field(..., description=\"Number\
      \ of records after cleaning\")\n    )\n    missing_value_removed: int = (\n\
      \        Field(..., description=\"Number of missing values removed\")\n    )\n\
      \    temperature_values: List[float] = (\n        Field(..., description=\"\
      List of temperature values after cleaning\")\n    )\n    humidity_values: List[float]\
      \ = (\n        Field(..., description=\"List of humidity values after cleaning\"\
      )\n    )\n    precipitation_values: List[float] = (\n        Field(..., description=\"\
      List of precipitation values after cleaning\")\n    )\n    wind_speed_values:\
      \ List[float] = (\n        Field(..., description=\"List of wind speed values\
      \ after cleaning\")\n    )\n    is_cleaned: bool = (\n        Field(..., description=\"\
      Indicates whether the cleaning process succeeded\")\n    )\n\n\ndef clean_historical_weather_data(get_historical_weather_data_input:\
      \ GetHistoricalWeatherDataOutput, **kwargs) -> CleanHistoricalWeatherDataOutput:\n\
      \    \"\"\"\n    Clean and preprocess historical weather data by removing missing\
      \ values,\n    normalizing numeric fields, and calculating derived metrics.\n\
      \n    Parameters\n    ----------\n    historical_dates : List[str]\n       \
      \ List of dates (YYYY-MM-DD) for which historical weather data is\n        retrieved.\n\
      \    historical_temperatures : List[float]\n        List of daily average temperatures\
      \ (in degrees Celsius)\n        corresponding to the dates.\n    historical_precipitation\
      \ : List[float]\n        List of daily precipitation amounts (in millimeters)\
      \ corresponding\n        to the dates.\n    historical_humidity : List[float]\n\
      \        List of daily average relative humidity percentages (0–100)\n     \
      \   corresponding to the dates.\n    historical_wind_speed : List[float]\n \
      \       List of daily average wind speeds (in km/h) corresponding to the\n \
      \       dates.\n    is_valid : bool\n        Flag indicating whether the retrieved\
      \ data set passed basic\n        integrity checks.\n\n    Returns\n    -------\n\
      \    Dict[str, Union[int, bool, List[float]]]\n        Dictionary containing\
      \ cleaned record counts, number of missing\n        values removed, normalized\
      \ temperature, humidity, precipitation, and\n        wind speed arrays, and\
      \ a success flag.\n\n    Raises\n    ------\n    ValueError\n        Raised\
      \ if `is_valid` is False or if any input lists have mismatched\n        lengths.\n\
      \n    Examples\n    --------\n    >>> clean_historical_weather_data(\n\n   \
      \ ...     historical_dates=['2025-12-01', '2025-12-02', '2025-12-03'],\n\n \
      \   ...     historical_temperatures=[-2.5, None, 0.0],\n\n    ...     historical_precipitation=[5.0,\
      \ 0.0, None],\n\n    ...     historical_humidity=[80.0, 75.0, 78.0],\n\n   \
      \ ...     historical_wind_speed=[15.0, 10.0, 12.0],\n\n    ...     is_valid=True\n\
      \n    >>> )\n    {\n      'cleaned_record_count': 2,\n      'missing_value_removed':\
      \ 2,\n      'temperature_values': [-2.5, 0.0],\n      'humidity_values': [80.0,\
      \ 75.0, 78.0],\n      'precipitation_values': [5.0, 0.0],\n      'wind_speed_values':\
      \ [15.0, 10.0, 12.0],\n      'is_cleaned': True\n    }\n\n    >>> clean_historical_weather_data(\n\
      \n    ...     historical_dates=['2025-12-01'],\n\n    ...     historical_temperatures=[None],\n\
      \n    ...     historical_precipitation=[None],\n\n    ...     historical_humidity=[None],\n\
      \n    ...     historical_wind_speed=[None],\n\n    ...     is_valid=False\n\n\
      \    >>> )\n    ValueError: Retrieved historical data failed basic integrity\
      \ checks.\n\n    \"\"\"\n    return CleanHistoricalWeatherDataOutput(\n    \
      \    cleaned_record_count=0,\n        missing_value_removed=0,\n        temperature_values=[],\n\
      \        humidity_values=[],\n        precipitation_values=[],\n        wind_speed_values=[],\n\
      \        is_cleaned=False,\n    )"
    name: clean_historical_weather_data
    nodes_depended_on:
    - get_historical_weather_data
    nodes_dependent_on: []
    output_structure:
    - description: Number of records after cleaning
      key: cleaned_record_count
      type: int
    - description: Number of missing values removed
      key: missing_value_removed
      type: int
    - description: List of temperature values after cleaning
      key: temperature_values
      type: List[float]
    - description: List of humidity values after cleaning
      key: humidity_values
      type: List[float]
    - description: List of precipitation values after cleaning
      key: precipitation_values
      type: List[float]
    - description: List of wind speed values after cleaning
      key: wind_speed_values
      type: List[float]
    - description: Indicates whether the cleaning process succeeded
      key: is_cleaned
      type: bool
    prd:
      conceptual_info: This node takes raw historical weather data and returns a cleaned,
        normalized, and statistically ready dataset that can be consumed by the forecasting
        pipeline.
      docstring:
        examples:
        - lines:
          - 'clean_historical_weather_data(

            '
          - '    historical_dates=[''2025-12-01'', ''2025-12-02'', ''2025-12-03''],

            '
          - '    historical_temperatures=[-2.5, None, 0.0],

            '
          - '    historical_precipitation=[5.0, 0.0, None],

            '
          - '    historical_humidity=[80.0, 75.0, 78.0],

            '
          - '    historical_wind_speed=[15.0, 10.0, 12.0],

            '
          - '    is_valid=True

            '
          - )
          output: "{\n  'cleaned_record_count': 2,\n  'missing_value_removed': 2,\n\
            \  'temperature_values': [-2.5, 0.0],\n  'humidity_values': [80.0, 75.0,\
            \ 78.0],\n  'precipitation_values': [5.0, 0.0],\n  'wind_speed_values':\
            \ [15.0, 10.0, 12.0],\n  'is_cleaned': True\n}"
        - lines:
          - 'clean_historical_weather_data(

            '
          - '    historical_dates=[''2025-12-01''],

            '
          - '    historical_temperatures=[None],

            '
          - '    historical_precipitation=[None],

            '
          - '    historical_humidity=[None],

            '
          - '    historical_wind_speed=[None],

            '
          - '    is_valid=False

            '
          - )
          output: 'ValueError: Retrieved historical data failed basic integrity checks.'
        parameters:
        - description: List of dates (YYYY-MM-DD) for which historical weather data
            is retrieved.
          name: historical_dates
          type: List[str]
        - description: List of daily average temperatures (in degrees Celsius) corresponding
            to the dates.
          name: historical_temperatures
          type: List[float]
        - description: List of daily precipitation amounts (in millimeters) corresponding
            to the dates.
          name: historical_precipitation
          type: List[float]
        - description: List of daily average relative humidity percentages (0–100)
            corresponding to the dates.
          name: historical_humidity
          type: List[float]
        - description: List of daily average wind speeds (in km/h) corresponding to
            the dates.
          name: historical_wind_speed
          type: List[float]
        - description: Flag indicating whether the retrieved data set passed basic
            integrity checks.
          name: is_valid
          type: bool
        raises:
        - description: Raised if `is_valid` is False or if any input lists have mismatched
            lengths.
          type: ValueError
        returns:
          description: Dictionary containing cleaned record counts, number of missing
            values removed, normalized temperature, humidity, precipitation, and wind
            speed arrays, and a success flag.
          type: Dict[str, Union[int, bool, List[float]]]
        summary: Clean and preprocess historical weather data by removing missing
          values, normalizing numeric fields, and calculating derived metrics.
    prompt: Clean and preprocess the historical weather data by handling missing values
      and normalizing the data
    shims: []
  format_weather_prediction:
    agent: false
    code_node_type: stub
    description: Takes the raw forecast from the weather model and transforms it into
      a structured, presentation‑ready format, adding derived high/low temperatures,
      estimated precipitation amounts, and concise summary sentences for each day.
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass PredictNextWeekWeatherOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for predict_next_week_weather node outputs.\"\"\"\n    week_start_date: str\
      \ = (\n        Field(..., description=\"ISO date string representing the first\
      \ day of the forecast week.\")\n    )\n    daily_temperatures: float = (\n \
      \       Field(..., description=\"Predicted average temperature for each day\
      \ of the week.\")\n    )\n    daily_precipitation: float = (\n        Field(...,\
      \ description=\"Predicted precipitation probability (0\\u2011100%) for each\
      \ day of the week.\")\n    )\n    daily_weather_descriptions: str = (\n    \
      \    Field(..., description=\"Human\\u2011readable weather description for each\
      \ day (e.g., 'Sunny', 'Rainy').\")\n    )\n\n\nclass FormatWeatherPredictionOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for format_weather_prediction node outputs.\"\"\"\n\
      \    date: List[str] = (\n        Field(..., description=\"ISO date string (YYYY-MM-DD)\
      \ for each forecast day.\")\n    )\n    high_temp: List[float] = (\n       \
      \ Field(..., description=\"Predicted high temperature for each day (\\u00b0C).\"\
      )\n    )\n    low_temp: List[float] = (\n        Field(..., description=\"Predicted\
      \ low temperature for each day (\\u00b0C).\")\n    )\n    precipitation_chance:\
      \ List[float] = (\n        Field(..., description=\"Probability of precipitation\
      \ (0\\u2013100%).\")\n    )\n    precipitation_amount: List[float] = (\n   \
      \     Field(..., description=\"Estimated precipitation volume in millimeters.\"\
      )\n    )\n    summary: List[str] = (\n        Field(..., description=\"Human\\\
      u2011readable summary sentence for each day.\")\n    )\n\n\ndef format_weather_prediction(predict_next_week_weather_input:\
      \ PredictNextWeekWeatherOutput, **kwargs) -> FormatWeatherPredictionOutput:\n\
      \    \"\"\"\n    Format raw weather predictions into a structured report with\
      \ derived metrics\n    and summaries.\n\n    Parameters\n    ----------\n  \
      \  week_start_date : str\n        ISO date string of the first day of the forecast\
      \ week.\n    daily_temperatures : List[float]\n        Predicted average temperature\
      \ (°C) for each day of the week.\n    daily_precipitation : List[float]\n  \
      \      Predicted precipitation probability (0–100%) for each day.\n    daily_weather_descriptions\
      \ : List[str]\n        Human‑readable weather description for each day (e.g.,\
      \ 'Sunny').\n\n    Returns\n    -------\n    Dict[str, List[Union[str, float]]]\n\
      \        Dictionary containing dates, high/low temps, precipitation chance,\n\
      \        estimated amount, and daily summary sentences.\n\n    Raises\n    ------\n\
      \    ValueError\n        If the three input lists have different lengths.\n\
      \    TypeError\n        If any input is not of the expected type.\n\n    Examples\n\
      \    --------\n    >>> week_start_date = '2026-01-09',\n    >>> daily_temperatures\
      \ = [5.0, 6.0, 7.0, 4.5, 8.0, 6.5, 7.5],\n    >>> daily_precipitation = [10.0,\
      \ 20.0, 0.0, 50.0, 5.0, 30.0, 15.0],\n    >>> daily_weather_descriptions = ['Sunny',\
      \ 'Cloudy', 'Clear', 'Rainy',\n    'Sunny', 'Rainy', 'Cloudy'],\n    >>> output\
      \ = format_weather_prediction(\n    ...     week_start_date,\n    ...     daily_temperatures,\n\
      \    ...     daily_precipitation,\n    ...     daily_weather_descriptions\n\
      \    >>> )\n    {\n      'date': ['2026-01-09', '2026-01-10', '2026-01-11',\
      \ '2026-01-12',\n    '2026-01-13', '2026-01-14', '2026-01-15'],\n      'high_temp':\
      \ [10.0, 11.0, 12.0, 9.5, 13.0, 11.5, 12.5],\n      'low_temp': [0.0, 1.0, 2.0,\
      \ -0.5, 3.0, 1.5, 2.5],\n      'precipitation_chance': [10.0, 20.0, 0.0, 50.0,\
      \ 5.0, 30.0, 15.0],\n      'precipitation_amount': [1.0, 2.0, 0.0, 5.0, 0.5,\
      \ 3.0, 1.5],\n      'summary': [\n        'Sunny with a high of 10.0°C and a\
      \ low of 0.0°C. Precipitation chance\n    10%.',\n        'Cloudy with a high\
      \ of 11.0°C and a low of 1.0°C. Precipitation chance\n    20%.',\n        'Clear\
      \ day, high 12.0°C, low 2.0°C. No precipitation expected.',\n        'Rainy\
      \ forecast; high 9.5°C, low -0.5°C. 50% chance of rain.',\n        'Sunny again,\
      \ high 13.0°C, low 3.0°C. Light chance of precipitation\n    (5%).',\n     \
      \   'Rainy conditions, high 11.5°C, low 1.5°C. 30% chance of rain.',\n     \
      \   'Cloudy with high 12.5°C, low 2.5°C. 15% chance of precipitation.'\n   \
      \   ]\n    }\n\n    \"\"\"\n    return FormatWeatherPredictionOutput(\n    \
      \    date=[],\n        high_temp=[],\n        low_temp=[],\n        precipitation_chance=[],\n\
      \        precipitation_amount=[],\n        summary=[],\n    )"
    name: format_weather_prediction
    nodes_depended_on:
    - predict_next_week_weather
    nodes_dependent_on: []
    output_structure:
    - description: ISO date string (YYYY-MM-DD) for each forecast day.
      key: date
      type: List[str]
    - description: Predicted high temperature for each day (°C).
      key: high_temp
      type: List[float]
    - description: Predicted low temperature for each day (°C).
      key: low_temp
      type: List[float]
    - description: Probability of precipitation (0–100%).
      key: precipitation_chance
      type: List[float]
    - description: Estimated precipitation volume in millimeters.
      key: precipitation_amount
      type: List[float]
    - description: Human‑readable summary sentence for each day.
      key: summary
      type: List[str]
    prd:
      conceptual_info: Transforms a machine‑learning forecast into a user‑friendly
        report.
      docstring:
        examples:
        - lines:
          - week_start_date = '2026-01-09',
          - daily_temperatures = [5.0, 6.0, 7.0, 4.5, 8.0, 6.5, 7.5],
          - daily_precipitation = [10.0, 20.0, 0.0, 50.0, 5.0, 30.0, 15.0],
          - daily_weather_descriptions = ['Sunny', 'Cloudy', 'Clear', 'Rainy', 'Sunny',
            'Rainy', 'Cloudy'],
          - output = format_weather_prediction(
          - '    week_start_date,'
          - '    daily_temperatures,'
          - '    daily_precipitation,'
          - '    daily_weather_descriptions'
          - )
          output: "{\n  'date': ['2026-01-09', '2026-01-10', '2026-01-11', '2026-01-12',\
            \ '2026-01-13', '2026-01-14', '2026-01-15'],\n  'high_temp': [10.0, 11.0,\
            \ 12.0, 9.5, 13.0, 11.5, 12.5],\n  'low_temp': [0.0, 1.0, 2.0, -0.5, 3.0,\
            \ 1.5, 2.5],\n  'precipitation_chance': [10.0, 20.0, 0.0, 50.0, 5.0, 30.0,\
            \ 15.0],\n  'precipitation_amount': [1.0, 2.0, 0.0, 5.0, 0.5, 3.0, 1.5],\n\
            \  'summary': [\n    'Sunny with a high of 10.0°C and a low of 0.0°C.\
            \ Precipitation chance 10%.',\n    'Cloudy with a high of 11.0°C and a\
            \ low of 1.0°C. Precipitation chance 20%.',\n    'Clear day, high 12.0°C,\
            \ low 2.0°C. No precipitation expected.',\n    'Rainy forecast; high 9.5°C,\
            \ low -0.5°C. 50% chance of rain.',\n    'Sunny again, high 13.0°C, low\
            \ 3.0°C. Light chance of precipitation (5%).',\n    'Rainy conditions,\
            \ high 11.5°C, low 1.5°C. 30% chance of rain.',\n    'Cloudy with high\
            \ 12.5°C, low 2.5°C. 15% chance of precipitation.'\n  ]\n}"
        parameters:
        - description: ISO date string of the first day of the forecast week.
          name: week_start_date
          type: str
        - description: Predicted average temperature (°C) for each day of the week.
          name: daily_temperatures
          type: List[float]
        - description: Predicted precipitation probability (0–100%) for each day.
          name: daily_precipitation
          type: List[float]
        - description: Human‑readable weather description for each day (e.g., 'Sunny').
          name: daily_weather_descriptions
          type: List[str]
        raises:
        - description: If the three input lists have different lengths.
          type: ValueError
        - description: If any input is not of the expected type.
          type: TypeError
        returns:
          description: Dictionary containing dates, high/low temps, precipitation
            chance, estimated amount, and daily summary sentences.
          type: Dict[str, List[Union[str, float]]]
        summary: Format raw weather predictions into a structured report with derived
          metrics and summaries.
    prompt: Format the predicted weather data into a human-readable format, including
      temperature, precipitation, and other relevant details
    shims: []
  get_current_weather_data:
    agent: false
    code_node_type: stub
    description: Retrieve current weather data for the given zip code
    implementation: "from pydantic import BaseModel, Field\n\n\nclass GetZipCodeOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for get_zip_code node outputs.\"\"\"\n    zip_code:\
      \ str = (\n        Field(..., description=\"The ZIP code entered by the user\
      \ for which the weather forecast will be predicted\")\n    )\n\n\nclass GetCurrentWeatherDataOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for get_current_weather_data node outputs.\"\"\"\n\
      \    temperature_celsius: float = (\n        Field(..., description=\"Current\
      \ air temperature in degrees Celsius\")\n    )\n    humidity_percent: float\
      \ = (\n        Field(..., description=\"Current relative humidity as a percentage\
      \ (0\\u2013100)\")\n    )\n    wind_speed_kmh: float = (\n        Field(...,\
      \ description=\"Current wind speed in kilometers per hour\")\n    )\n    precipitation_mm:\
      \ float = (\n        Field(..., description=\"Current precipitation amount in\
      \ millimeters\")\n    )\n    condition_description: str = (\n        Field(...,\
      \ description=\"Human\\u2011readable weather condition (e.g., \\\"Clear\\\"\
      , \\\"Rain\\\", \\\"Snow\\\")\")\n    )\n    observation_time: str = (\n   \
      \     Field(..., description=\"Timestamp of the observation in ISO 8601 format\
      \ (e.g., \\\"2026-01-09T14:00:00Z\\\")\")\n    )\n    is_valid: bool = (\n \
      \       Field(..., description=\"Flag indicating whether the retrieved data\
      \ passed validation checks\")\n    )\n\n\ndef get_current_weather_data(get_zip_code_input:\
      \ GetZipCodeOutput, **kwargs) -> GetCurrentWeatherDataOutput:\n    \"\"\"\n\
      \    Retrieves current weather data for a specified ZIP code from a reliable\n\
      \    external weather API.\n\n    Parameters\n    ----------\n    zip_code :\
      \ str\n        A 5‑digit U.S. ZIP code for which to obtain the weather data.\n\
      \n    Returns\n    -------\n    dict\n        Dictionary containing current\
      \ temperature, humidity, wind speed,\n        precipitation, condition description,\
      \ observation timestamp, and a\n        validation flag.\n\n    Raises\n   \
      \ ------\n    ValueError\n        Raised if the supplied `zip_code` is empty\
      \ or not a valid 5‑digit\n        string.\n    RuntimeError\n        Raised\
      \ when the external API request fails or returns invalid data.\n\n    Examples\n\
      \    --------\n    >>> weather = get_current_weather_data('10001')\n    >>>\
      \ print(weather['temperature_celsius'])\n    >>> print(weather['is_valid'])\n\
      \    4.7\n    True\n\n    >>> try:\n    ...     get_current_weather_data('ABCDE')\n\
      \    >>> except ValueError as e:\n    ...     print(e)\n    \"zip_code must\
      \ be a 5‑digit string\"\n\n    \"\"\"\n    return GetCurrentWeatherDataOutput(\n\
      \        temperature_celsius=0.0,\n        humidity_percent=0.0,\n        wind_speed_kmh=0.0,\n\
      \        precipitation_mm=0.0,\n        condition_description=\"\",\n      \
      \  observation_time=\"\",\n        is_valid=False,\n    )"
    name: get_current_weather_data
    nodes_depended_on:
    - get_zip_code
    nodes_dependent_on: []
    output_structure:
    - description: Current air temperature in degrees Celsius
      key: temperature_celsius
      type: float
    - description: Current relative humidity as a percentage (0–100)
      key: humidity_percent
      type: float
    - description: Current wind speed in kilometers per hour
      key: wind_speed_kmh
      type: float
    - description: Current precipitation amount in millimeters
      key: precipitation_mm
      type: float
    - description: Human‑readable weather condition (e.g., "Clear", "Rain", "Snow")
      key: condition_description
      type: str
    - description: Timestamp of the observation in ISO 8601 format (e.g., "2026-01-09T14:00:00Z")
      key: observation_time
      type: str
    - description: Flag indicating whether the retrieved data passed validation checks
      key: is_valid
      type: bool
    prd:
      conceptual_info: Collects real‑time weather observations for a user‑specified
        ZIP code, normalizes the data, and validates the response before passing it
        to downstream forecasting steps.
      docstring:
        examples:
        - lines:
          - weather = get_current_weather_data('10001')
          - print(weather['temperature_celsius'])
          - print(weather['is_valid'])
          output: '4.7

            True'
        - lines:
          - 'try:'
          - '    get_current_weather_data(''ABCDE'')'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"zip_code must be a 5‑digit string"'
        parameters:
        - description: A 5‑digit U.S. ZIP code for which to obtain the weather data.
          name: zip_code
          type: str
        raises:
        - description: Raised if the supplied `zip_code` is empty or not a valid 5‑digit
            string.
          type: ValueError
        - description: Raised when the external API request fails or returns invalid
            data.
          type: RuntimeError
        returns:
          description: Dictionary containing current temperature, humidity, wind speed,
            precipitation, condition description, observation timestamp, and a validation
            flag.
          type: dict
        summary: Retrieves current weather data for a specified ZIP code from a reliable
          external weather API.
    prompt: Fetch current weather data for the given zip code from a reliable weather
      data source
    shims: []
