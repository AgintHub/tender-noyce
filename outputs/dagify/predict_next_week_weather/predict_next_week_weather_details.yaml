    description: Retrieve historical weather data for the given zip code
    implementation: "from pydantic import BaseModel, Field\nfrom typing import List\n\
      \n\nclass GetZipCodeOutput(BaseModel):\n    \"\"\"Pydantic model for get_zip_code\
