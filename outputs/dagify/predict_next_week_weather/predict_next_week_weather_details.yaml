      The ZIP code entered by the user for which the weather forecast will be predicted\"\
      )\n    )\n\n\nclass GetHistoricalWeatherDataOutput(BaseModel):\n    \"\"\"Pydantic\
      \ model for get_historical_weather_data node outputs.\"\"\"\n    historical_dates:\
      \ List[str] = (\n        Field(..., description=\"List of dates (YYYY-MM-DD)\
      \ for which historical weather data is retrieved\")\n    )\n    historical_temperatures:\
      \ List[float] = (\n        Field(..., description=\"List of daily average temperatures\
