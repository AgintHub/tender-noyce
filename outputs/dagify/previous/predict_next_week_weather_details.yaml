dag_type: plain_text
description: A workflow to predict next week's weather in a given zip code
name: predict_next_week_weather
nodes:
  clean_historical_weather_data:
    agent: false
    description: Clean and preprocess the historical weather data
    name: clean_historical_weather_data
    nodes_depended_on:
    - get_historical_weather_data
    nodes_dependent_on: []
    prompt: Clean and preprocess the historical weather data by handling missing values
      and normalizing the data
  format_weather_prediction:
    agent: false
    description: Format the predicted weather data for presentation
    name: format_weather_prediction
    nodes_depended_on:
    - predict_next_week_weather
    nodes_dependent_on: []
    prompt: Format the predicted weather data into a human-readable format, including
      temperature, precipitation, and other relevant details
  get_current_weather_data:
    agent: false
    description: Retrieve current weather data for the given zip code
    name: get_current_weather_data
    nodes_depended_on:
    - get_zip_code
    nodes_dependent_on: []
    prompt: Fetch current weather data for the given zip code from a reliable weather
      data source
  get_historical_weather_data:
    agent: false
    description: Retrieve historical weather data for the given zip code
    name: get_historical_weather_data
    nodes_depended_on:
    - get_zip_code
    nodes_dependent_on: []
    prompt: Fetch historical weather data for the given zip code from a reliable weather
      data source
  get_zip_code:
    agent: false
    description: Get the zip code for which the weather needs to be predicted
    name: get_zip_code
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Enter the zip code for which you want to predict the weather
  predict_next_week_weather:
    agent: false
    description: Use the trained model to predict next week's weather
    name: predict_next_week_weather
    nodes_depended_on:
    - train_weather_model
    nodes_dependent_on: []
    prompt: Use the trained model to predict the weather for the next week in the
      given zip code
  prepare_forecast_features:
    agent: false
    description: Prepare features required for weather forecasting
    name: prepare_forecast_features
    nodes_depended_on:
    - clean_historical_weather_data
    - get_current_weather_data
    nodes_dependent_on: []
    prompt: Prepare the necessary features for weather forecasting, including historical
      weather patterns and current weather conditions
  train_weather_model:
    agent: false
    description: Train a machine learning model to predict the weather
    name: train_weather_model
    nodes_depended_on:
    - prepare_forecast_features
    nodes_dependent_on: []
    prompt: Train a suitable machine learning model using the prepared features to
      predict next week's weather
