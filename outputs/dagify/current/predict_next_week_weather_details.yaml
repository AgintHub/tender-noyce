dag_type: spec
description: Generated workflow from UI.
name: predict_next_week_weather
nodes:
  clean_historical_weather_data:
    agent: false
    description: Retrieve historical weather data from a reliable source and transform
      it into a consistent, missing‑value‑free, and normalized dataset suitable for
      downstream machine learning training and forecasting.
    name: clean_historical_weather_data
    nodes_depended_on:
    - get_historical_weather_data
    nodes_dependent_on: []
    output_structure:
    - description: Number of records after cleaning
      key: cleaned_record_count
      type: int
    - description: Number of missing values removed
      key: missing_value_removed
      type: int
    - description: List of temperature values after cleaning
      key: temperature_values
      type: List[float]
    - description: List of humidity values after cleaning
      key: humidity_values
      type: List[float]
    - description: List of precipitation values after cleaning
      key: precipitation_values
      type: List[float]
    - description: List of wind speed values after cleaning
      key: wind_speed_values
      type: List[float]
    - description: Indicates whether the cleaning process succeeded
      key: is_cleaned
      type: bool
    prd:
      conceptual_info: This node takes raw historical weather data and returns a cleaned,
        normalized, and statistically ready dataset that can be consumed by the forecasting
        pipeline.
      docstring:
        examples:
        - lines:
          - 'clean_historical_weather_data(

            '
          - '    historical_dates=[''2025-12-01'', ''2025-12-02'', ''2025-12-03''],

            '
          - '    historical_temperatures=[-2.5, None, 0.0],

            '
          - '    historical_precipitation=[5.0, 0.0, None],

            '
          - '    historical_humidity=[80.0, 75.0, 78.0],

            '
          - '    historical_wind_speed=[15.0, 10.0, 12.0],

            '
          - '    is_valid=True

            '
          - )
          output: "{\n  'cleaned_record_count': 2,\n  'missing_value_removed': 2,\n\
            \  'temperature_values': [-2.5, 0.0],\n  'humidity_values': [80.0, 75.0,\
            \ 78.0],\n  'precipitation_values': [5.0, 0.0],\n  'wind_speed_values':\
            \ [15.0, 10.0, 12.0],\n  'is_cleaned': True\n}"
        - lines:
          - 'clean_historical_weather_data(

            '
          - '    historical_dates=[''2025-12-01''],

            '
          - '    historical_temperatures=[None],

            '
          - '    historical_precipitation=[None],

            '
          - '    historical_humidity=[None],

            '
          - '    historical_wind_speed=[None],

            '
          - '    is_valid=False

            '
          - )
          output: 'ValueError: Retrieved historical data failed basic integrity checks.'
        parameters:
        - description: List of dates (YYYY-MM-DD) for which historical weather data
            is retrieved.
          name: historical_dates
          type: List[str]
        - description: List of daily average temperatures (in degrees Celsius) corresponding
            to the dates.
          name: historical_temperatures
          type: List[float]
        - description: List of daily precipitation amounts (in millimeters) corresponding
            to the dates.
          name: historical_precipitation
          type: List[float]
        - description: List of daily average relative humidity percentages (0–100)
            corresponding to the dates.
          name: historical_humidity
          type: List[float]
        - description: List of daily average wind speeds (in km/h) corresponding to
            the dates.
          name: historical_wind_speed
          type: List[float]
        - description: Flag indicating whether the retrieved data set passed basic
            integrity checks.
          name: is_valid
          type: bool
        raises:
        - description: Raised if `is_valid` is False or if any input lists have mismatched
            lengths.
          type: ValueError
        returns:
          description: Dictionary containing cleaned record counts, number of missing
            values removed, normalized temperature, humidity, precipitation, and wind
            speed arrays, and a success flag.
          type: Dict[str, Union[int, bool, List[float]]]
        summary: Clean and preprocess historical weather data by removing missing
          values, normalizing numeric fields, and calculating derived metrics.
    prompt: Clean and preprocess the historical weather data by handling missing values
      and normalizing the data
  format_weather_prediction:
    agent: false
    description: Takes the raw forecast from the weather model and transforms it into
      a structured, presentation‑ready format, adding derived high/low temperatures,
      estimated precipitation amounts, and concise summary sentences for each day.
    name: format_weather_prediction
    nodes_depended_on:
    - predict_next_week_weather
    nodes_dependent_on: []
    output_structure:
    - description: ISO date string (YYYY-MM-DD) for each forecast day.
      key: date
      type: List[str]
    - description: Predicted high temperature for each day (°C).
      key: high_temp
      type: List[float]
    - description: Predicted low temperature for each day (°C).
      key: low_temp
      type: List[float]
    - description: Probability of precipitation (0–100%).
      key: precipitation_chance
      type: List[float]
    - description: Estimated precipitation volume in millimeters.
      key: precipitation_amount
      type: List[float]
    - description: Human‑readable summary sentence for each day.
      key: summary
      type: List[str]
    prd:
      conceptual_info: Transforms a machine‑learning forecast into a user‑friendly
        report.
      docstring:
        examples:
        - lines:
          - week_start_date = '2026-01-09',
          - daily_temperatures = [5.0, 6.0, 7.0, 4.5, 8.0, 6.5, 7.5],
          - daily_precipitation = [10.0, 20.0, 0.0, 50.0, 5.0, 30.0, 15.0],
          - daily_weather_descriptions = ['Sunny', 'Cloudy', 'Clear', 'Rainy', 'Sunny',
            'Rainy', 'Cloudy'],
          - output = format_weather_prediction(
          - '    week_start_date,'
          - '    daily_temperatures,'
          - '    daily_precipitation,'
          - '    daily_weather_descriptions'
          - )
          output: "{\n  'date': ['2026-01-09', '2026-01-10', '2026-01-11', '2026-01-12',\
            \ '2026-01-13', '2026-01-14', '2026-01-15'],\n  'high_temp': [10.0, 11.0,\
            \ 12.0, 9.5, 13.0, 11.5, 12.5],\n  'low_temp': [0.0, 1.0, 2.0, -0.5, 3.0,\
            \ 1.5, 2.5],\n  'precipitation_chance': [10.0, 20.0, 0.0, 50.0, 5.0, 30.0,\
            \ 15.0],\n  'precipitation_amount': [1.0, 2.0, 0.0, 5.0, 0.5, 3.0, 1.5],\n\
            \  'summary': [\n    'Sunny with a high of 10.0°C and a low of 0.0°C.\
            \ Precipitation chance 10%.',\n    'Cloudy with a high of 11.0°C and a\
            \ low of 1.0°C. Precipitation chance 20%.',\n    'Clear day, high 12.0°C,\
            \ low 2.0°C. No precipitation expected.',\n    'Rainy forecast; high 9.5°C,\
            \ low -0.5°C. 50% chance of rain.',\n    'Sunny again, high 13.0°C, low\
            \ 3.0°C. Light chance of precipitation (5%).',\n    'Rainy conditions,\
            \ high 11.5°C, low 1.5°C. 30% chance of rain.',\n    'Cloudy with high\
            \ 12.5°C, low 2.5°C. 15% chance of precipitation.'\n  ]\n}"
        parameters:
        - description: ISO date string of the first day of the forecast week.
          name: week_start_date
          type: str
        - description: Predicted average temperature (°C) for each day of the week.
          name: daily_temperatures
          type: List[float]
        - description: Predicted precipitation probability (0–100%) for each day.
          name: daily_precipitation
          type: List[float]
        - description: Human‑readable weather description for each day (e.g., 'Sunny').
          name: daily_weather_descriptions
          type: List[str]
        raises:
        - description: If the three input lists have different lengths.
          type: ValueError
        - description: If any input is not of the expected type.
          type: TypeError
        returns:
          description: Dictionary containing dates, high/low temps, precipitation
            chance, estimated amount, and daily summary sentences.
          type: Dict[str, List[Union[str, float]]]
        summary: Format raw weather predictions into a structured report with derived
          metrics and summaries.
    prompt: Format the predicted weather data into a human-readable format, including
      temperature, precipitation, and other relevant details
  get_current_weather_data:
    agent: false
    description: Retrieve current weather data for the given zip code
    name: get_current_weather_data
    nodes_depended_on:
    - get_zip_code
    nodes_dependent_on: []
    output_structure:
    - description: Current air temperature in degrees Celsius
      key: temperature_celsius
      type: float
    - description: Current relative humidity as a percentage (0–100)
      key: humidity_percent
      type: float
    - description: Current wind speed in kilometers per hour
      key: wind_speed_kmh
      type: float
    - description: Current precipitation amount in millimeters
      key: precipitation_mm
      type: float
    - description: Human‑readable weather condition (e.g., "Clear", "Rain", "Snow")
      key: condition_description
      type: str
    - description: Timestamp of the observation in ISO 8601 format (e.g., "2026-01-09T14:00:00Z")
      key: observation_time
      type: str
    - description: Flag indicating whether the retrieved data passed validation checks
      key: is_valid
      type: bool
    prd:
      conceptual_info: Collects real‑time weather observations for a user‑specified
        ZIP code, normalizes the data, and validates the response before passing it
        to downstream forecasting steps.
      docstring:
        examples:
        - lines:
          - weather = get_current_weather_data('10001')
          - print(weather['temperature_celsius'])
          - print(weather['is_valid'])
          output: '4.7

            True'
        - lines:
          - 'try:'
          - '    get_current_weather_data(''ABCDE'')'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"zip_code must be a 5‑digit string"'
        parameters:
        - description: A 5‑digit U.S. ZIP code for which to obtain the weather data.
          name: zip_code
          type: str
        raises:
        - description: Raised if the supplied `zip_code` is empty or not a valid 5‑digit
            string.
          type: ValueError
        - description: Raised when the external API request fails or returns invalid
            data.
          type: RuntimeError
        returns:
          description: Dictionary containing current temperature, humidity, wind speed,
            precipitation, condition description, observation timestamp, and a validation
            flag.
          type: dict
        summary: Retrieves current weather data for a specified ZIP code from a reliable
          external weather API.
    prompt: Fetch current weather data for the given zip code from a reliable weather
      data source
  get_historical_weather_data:
    agent: false
    description: Retrieve historical weather data for the given zip code
    name: get_historical_weather_data
    nodes_depended_on:
    - get_zip_code
    nodes_dependent_on: []
    output_structure:
    - description: List of dates (YYYY-MM-DD) for which historical weather data is
        retrieved
      key: historical_dates
      type: List[str]
    - description: List of daily average temperatures (in degrees Celsius) corresponding
        to the dates
      key: historical_temperatures
      type: List[float]
    - description: List of daily precipitation amounts (in millimeters) corresponding
        to the dates
      key: historical_precipitation
      type: List[float]
    - description: Whether the retrieved historical data set passed basic integrity
        checks
      key: is_valid
      type: bool
    prd:
      conceptual_info: This node acts as the gateway to historical meteorological
        data for a user‑specified ZIP code. It queries an external weather archive
        API, performs minimal sanity checks, and returns structured lists that downstream
        cleaning and feature‑engineering nodes can consume.
      docstring:
        examples:
        - lines:
          - data = get_historical_weather_data('90210')
          output: '''{''historical_dates'': [''2026-01-01'', ''2026-01-02''], ''historical_temperatures'':
            [12.5, 13.0], ''historical_precipitation'': [0.0, 5.2], ''is_valid'':
            True}'''
        - lines:
          - data = get_historical_weather_data('99999')
          output: 'ValueError: ZIP code ''99999'' is invalid or not found in the data
            source.'
        parameters:
        - description: The ZIP code for which historical weather data is to be retrieved.
            Must be a 5‑digit numeric string.
          name: zip_code
          type: str
        raises:
        - description: Raised if `zip_code` is not a valid 5‑digit string or if the
            data source reports the ZIP code as unknown.
          type: ValueError
        - description: Raised when the external weather API is unreachable or times
            out.
          type: ConnectionError
        - description: Raised if the retrieved dataset is empty or malformed.
          type: RuntimeError
        returns:
          description: 'A dictionary containing the following keys:

            - `historical_dates` (List[str]) – dates in YYYY‑MM‑DD format

            - `historical_temperatures` (List[float]) – daily average temperatures
            in Celsius

            - `historical_precipitation` (List[float]) – daily precipitation amounts
            in millimeters

            - `is_valid` (bool) – flag indicating whether the data passed basic validation
            checks'
          type: Dict[str, Any]
        summary: Fetches historical weather data for a ZIP code and returns structured
          lists of dates, temperatures, and precipitation.
    prompt: Fetch historical weather data for the given zip code from a reliable weather
      data source
  get_zip_code:
    agent: false
    description: Get the zip code for which the weather needs to be predicted
    name: get_zip_code
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: The ZIP code entered by the user for which the weather forecast
        will be predicted
      key: zip_code
      type: str
    prd:
      conceptual_info: Collects a valid US ZIP code from the user to be used in subsequent
        weather data retrieval and prediction steps.
      docstring:
        examples:
        - lines:
          - 'def mock_input(prompt: str) -> str:'
          - '    return ''90210'''
          - zip_code = get_zip_code()
          output: '''90210'''
        - lines:
          - 'def mock_input(prompt: str) -> str:'
          - '    return ''ABC12'''
          - 'try:'
          - '    zip_code = get_zip_code()'
          - 'except ValueError as e:'
          - '    print(e)'
          output: '"Invalid ZIP code: must be a 5-digit numeric string"'
        parameters: []
        raises:
        - description: If the user input is not a 5‑digit numeric string or is otherwise
            invalid.
          type: ValueError
        returns:
          description: A 5‑digit US ZIP code string that will be passed to downstream
            weather data nodes.
          type: str
        summary: Prompt the user for a ZIP code and validate the input.
    prompt: Enter the zip code for which you want to predict the weather
  predict_next_week_weather:
    agent: false
    description: Use the trained machine learning model to forecast weather conditions
      for the upcoming week for a specific ZIP code.
    name: predict_next_week_weather
    nodes_depended_on:
    - train_weather_model
    nodes_dependent_on: []
    output_structure:
    - description: ISO date string representing the first day of the forecast week.
      key: week_start_date
      type: str
    - description: Predicted average temperature for each day of the week.
      key: daily_temperatures
      type: float
    - description: Predicted precipitation probability (0‑100%) for each day of the
        week.
      key: daily_precipitation
      type: float
    - description: Human‑readable weather description for each day (e.g., 'Sunny',
        'Rainy').
      key: daily_weather_descriptions
      type: str
    prd:
      conceptual_info: This node loads the previously trained weather prediction model
        and applies it to the cleaned historical and current weather data, producing
        a week‑ahead forecast for a user‑specified ZIP code.
      docstring:
        examples:
        - lines:
          - forecast = predict_next_week_weather(zip_code='02115', model_identifier='model_2026_01.pickle')
          - print(forecast['week_start_date'])
          output: '"2026-01-16"

            '
        - lines:
          - forecast = predict_next_week_weather(zip_code='02115', model_identifier='model_2026_01.pickle')
          - print(forecast['daily_temperatures'])
          - print(forecast['daily_precipitation'])
          - print(forecast['daily_weather_descriptions'])
          output: '[12.5, 13.0, 11.8, 10.2, 14.1, 13.9, 12.0]

            [15.0, 20.5, 5.0, 0.0, 30.0, 25.0, 10.0]

            [''Sunny'', ''Partly Cloudy'', ''Rain'', ''Clear'', ''Rainy'', ''Cloudy'',
            ''Sunny'']

            '
        parameters:
        - description: The 5‑digit ZIP code for which the forecast should be generated.
          name: zip_code
          type: str
        - description: Filename or unique ID of the trained weather prediction model
            returned by `train_weather_model`.
          name: model_identifier
          type: str
        raises:
        - description: If the model file identified by `model_identifier` cannot be
            located.
          type: FileNotFoundError
        - description: If the provided `zip_code` is not a 5‑digit string or the model
            fails to produce predictions.
          type: ValueError
        - description: If the prediction process encounters unexpected data issues.
          type: RuntimeError
        returns:
          description: Dictionary containing the week start date, daily temperatures,
            daily precipitation probabilities, and daily weather descriptions.
          type: dict
        summary: Predict the next week’s weather using a trained machine learning
          model.
    prompt: Use the trained model to predict the weather for the next week in the
      given zip code
  prepare_forecast_features:
    agent: false
    description: Collect and compute summary statistics from cleaned historical weather
      data and current weather observations to create a feature set for the forecasting
      model.
    name: prepare_forecast_features
    nodes_depended_on:
    - clean_historical_weather_data
    - get_current_weather_data
    nodes_dependent_on: []
    output_structure:
    - description: Average temperature over the historical period
      key: historical_avg_temperature
      type: float
    - description: Standard deviation of temperature over the historical period
      key: historical_std_temperature
      type: float
    - description: Total precipitation over the historical period
      key: historical_total_precipitation
      type: float
    - description: Average humidity over the historical period
      key: historical_avg_humidity
      type: float
    - description: Average wind speed over the historical period
      key: historical_avg_wind_speed
      type: float
    - description: Current temperature reading
      key: current_temperature
      type: float
    - description: Current humidity reading
      key: current_humidity
      type: float
    - description: Current precipitation reading
      key: current_precipitation
      type: float
    - description: Current wind speed reading
      key: current_wind_speed
      type: float
    prd:
      conceptual_info: Prepares a concise, machine‑ready feature vector from both
        historical and real‑time weather data, suitable for model training or inference.
      docstring:
        examples:
        - lines:
          - cleaned_data = {
          - '    ''cleaned_record_count'': 3,'
          - '    ''missing_value_removed'': 0,'
          - '    ''temperature_values'': [20.0, 21.5, 19.0],'
          - '    ''humidity_values'': [60.0, 55.0, 65.0],'
          - '    ''precipitation_values'': [5.0, 0.0, 2.0],'
          - '    ''wind_speed_values'': [15.0, 12.0, 18.0],'
          - '    ''is_cleaned'': True'
          - '} '
          - current_data = {
          - '    ''temperature_celsius'': 22.3,'
          - '    ''humidity_percent'': 58.0,'
          - '    ''wind_speed_kmh'': 12.0,'
          - '    ''precipitation_mm'': 0.0,'
          - '    ''condition_description'': ''Clear'','
          - '    ''observation_time'': ''2026-01-09T14:00:00Z'','
          - '    ''is_valid'': True'
          - '} '
          - features = prepare_forecast_features(cleaned_data, current_data)
          output: "{\n  'historical_avg_temperature': 20.166666666666668,\n  'historical_std_temperature':\
            \ 1.540309513061559,\n  'historical_total_precipitation': 7.0,\n  'historical_avg_humidity':\
            \ 60.0,\n  'historical_avg_wind_speed': 15.0,\n  'current_temperature':\
            \ 22.3,\n  'current_humidity': 58.0,\n  'current_precipitation': 0.0,\n\
            \  'current_wind_speed': 12.0\n}"
        - lines:
          - 'cleaned_data = {''is_cleaned'': False}'
          - 'current_data = {''is_valid'': True}'
          - prepare_forecast_features(cleaned_data, current_data)
          output: 'ValueError: cleaned_data is not cleaned or missing required fields.'
        parameters:
        - description: Dictionary returned by `clean_historical_weather_data`. Must
            contain the keys `temperature_values`, `humidity_values`, `precipitation_values`,
            `wind_speed_values`, and `is_cleaned`.
          name: cleaned_data
          type: dict
        - description: Dictionary returned by `get_current_weather_data`. Must contain
            the keys `temperature_celsius`, `humidity_percent`, `wind_speed_kmh`,
            `precipitation_mm`, and `is_valid`.
          name: current_data
          type: dict
        raises:
        - description: If any required field is missing or if `cleaned_data['is_cleaned']`
            or `current_data['is_valid']` is False.
          type: ValueError
        returns:
          description: 'A dictionary with keys:

            - `historical_avg_temperature`, `historical_std_temperature`, `historical_total_precipitation`,

            - `historical_avg_humidity`, `historical_avg_wind_speed`,

            - `current_temperature`, `current_humidity`, `current_precipitation`,
            `current_wind_speed`.'
          type: dict
        summary: Generate summary statistics from cleaned historical weather data
          and current observations to produce a feature dictionary for forecasting.
    prompt: Prepare the necessary features for weather forecasting, including historical
      weather patterns and current weather conditions
  train_weather_model:
    agent: false
    description: Train a machine learning model to predict the weather
    name: train_weather_model
    nodes_depended_on:
    - prepare_forecast_features
    nodes_dependent_on: []
    output_structure:
    - description: Unique identifier or filename for the trained weather prediction
        model
      key: model_identifier
      type: str
    - description: Indicates whether the model training completed successfully
      key: training_success
      type: bool
    - description: Validation accuracy (between 0 and 1) of the trained model on the
        validation set
      key: validation_accuracy
      type: float
    prd:
      conceptual_info: This node ingests statistical summaries of historical and current
        weather data, trains a predictive machine‑learning model, and returns a reference
        to the persisted model along with training status and validation performance.
      docstring:
        examples:
        - lines:
          - model_info = train_weather_model(
          - '    historical_avg_temperature=20.5,'
          - '    historical_std_temperature=5.2,'
          - '    historical_total_precipitation=120.0,'
          - '    historical_avg_humidity=60.0,'
          - '    historical_avg_wind_speed=15.0,'
          - '    current_temperature=22.0,'
          - '    current_humidity=55.0,'
          - '    current_precipitation=0.0,'
          - '    current_wind_speed=10.0'
          - )
          output: '{''model_identifier'': ''weather_model_v1.pkl'', ''training_success'':
            True, ''validation_accuracy'': 0.87}'
        - lines:
          - '# Using an intentionally bad input to trigger an error'
          - train_weather_model(
          - '    historical_avg_temperature=None,'
          - '    historical_std_temperature=5.2,'
          - '    historical_total_precipitation=120.0,'
          - '    historical_avg_humidity=60.0,'
          - '    historical_avg_wind_speed=15.0,'
          - '    current_temperature=22.0,'
          - '    current_humidity=55.0,'
          - '    current_precipitation=0.0,'
          - '    current_wind_speed=10.0'
          - )
          output: 'ValueError: historical_avg_temperature must be a float and cannot
            be None'
        parameters:
        - description: Average temperature over the historical period (°C).
          name: historical_avg_temperature
          type: float
        - description: Standard deviation of temperature over the historical period
            (°C).
          name: historical_std_temperature
          type: float
        - description: Total precipitation over the historical period (mm).
          name: historical_total_precipitation
          type: float
        - description: Average humidity over the historical period (%).
          name: historical_avg_humidity
          type: float
        - description: Average wind speed over the historical period (km/h).
          name: historical_avg_wind_speed
          type: float
        - description: Current temperature reading (°C).
          name: current_temperature
          type: float
        - description: Current humidity reading (%).
          name: current_humidity
          type: float
        - description: Current precipitation reading (mm).
          name: current_precipitation
          type: float
        - description: Current wind speed reading (km/h).
          name: current_wind_speed
          type: float
        raises:
        - description: Raised if any input feature is missing or out of expected bounds.
          type: ValueError
        - description: Raised if the training algorithm fails to converge.
          type: RuntimeError
        - description: Raised if the model cannot be serialized to disk.
          type: IOError
        returns:
          description: A dictionary containing the trained model identifier, a boolean
            flag indicating training success, and a float validation accuracy.
          type: dict[str, Any]
        summary: Trains a machine‑learning model for next‑week weather prediction.
    prompt: Train a suitable machine learning model using the prepared features to
      predict next week's weather
