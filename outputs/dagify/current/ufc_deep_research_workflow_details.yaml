dag_type: plain_text
description: A highly concurrent and parallel workflow for conducting in-depth research
  on the Ultimate Fighting Championship (UFC).
name: ufc_deep_research_workflow
nodes:
  analyze_fight_card_performance_metrics:
    agent: false
    description: Calculate and analyze various performance metrics for individual
      fight cards, including win ratio, knockout ratio, and submission ratio.
    name: analyze_fight_card_performance_metrics
    nodes_depended_on:
    - analyze_fight_card_statistics
    nodes_dependent_on: []
    prompt: What performance metrics for individual fight cards are relevant to this
      project? Include win ratio, knockout ratio, and submission ratio.
  analyze_fight_card_statistics:
    agent: false
    description: Collect and analyze statistics on fight cards, including fight order,
      weight classes, and fight times.
    name: analyze_fight_card_statistics
    nodes_depended_on:
    - gather_data_sources
    nodes_dependent_on: []
    prompt: What key statistics on fight cards are relevant to this project? Include
      fight order, weight classes, and fight times.
  analyze_fighter_performance_metrics:
    agent: false
    description: Calculate and analyze various performance metrics for individual
      fighters, including win ratio, knockout ratio, and submission ratio.
    name: analyze_fighter_performance_metrics
    nodes_depended_on:
    - analyze_fighter_statistics
    nodes_dependent_on: []
    prompt: What performance metrics for individual fighters are relevant to this
      project? Include win ratio, knockout ratio, and submission ratio.
  analyze_fighter_statistics:
    agent: false
    description: Collect and analyze statistics on individual fighters, including
      win-loss records, fight times, and submission ratios.
    name: analyze_fighter_statistics
    nodes_depended_on:
    - gather_data_sources
    nodes_dependent_on: []
    prompt: What key statistics on individual fighters are relevant to this project?
      Include win-loss records, fight times, and submission ratios.
  conduct_literature_review:
    agent: false
    description: Review and analyze existing research on the topic.
    name: conduct_literature_review
    nodes_depended_on:
    - gather_data_sources
    nodes_dependent_on: []
    prompt: What key findings from existing research are relevant to this project?
      Summarize the main ideas and theories.
  create_research_report:
    agent: false
    description: Compile and synthesize the research findings into a comprehensive
      report.
    name: create_research_report
    nodes_depended_on:
    - predict_fighter_outcomes
    - analyze_fighter_performance_metrics
    - analyze_fight_card_performance_metrics
    nodes_dependent_on: []
    prompt: What are the key conclusions and recommendations from this research project?
      Include a detailed executive summary.
  define_research_objectives:
    agent: false
    description: Identify the specific research goals and objectives.
    name: define_research_objectives
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: What is the main purpose of this research project? What specific questions
      or topics do you aim to investigate?
  develop_fight_card_profiles:
    agent: false
    description: Create detailed profiles of individual fight cards, including their
      odds, fight order, and expected outcomes.
    name: develop_fight_card_profiles
    nodes_depended_on:
    - analyze_fight_card_statistics
    nodes_dependent_on: []
    prompt: What are the key attributes of each fight card that are relevant to this
      project? Include odds, fight order, and expected outcomes.
  develop_fighter_profiles:
    agent: false
    description: Create detailed profiles of individual fighters, including their
      skills, strengths, and weaknesses.
    name: develop_fighter_profiles
    nodes_depended_on:
    - analyze_fighter_statistics
    nodes_dependent_on: []
    prompt: What are the key attributes of each fighter that are relevant to this
      project? Include skills, strengths, and weaknesses.
  gather_data_sources:
    agent: false
    description: Collect relevant data sources, including articles, books, videos,
      and expert interviews.
    name: gather_data_sources
    nodes_depended_on:
    - define_research_objectives
    nodes_dependent_on: []
    prompt: What data sources are relevant to this research project? Include a list
      of articles, books, videos, and expert interviews.
  predict_fighter_outcomes:
    agent: false
    description: Use statistical models to predict the outcomes of individual fights
      based on fighter and fight card statistics.
    name: predict_fighter_outcomes
    nodes_depended_on:
    - develop_fighter_profiles
    - develop_fight_card_profiles
    nodes_dependent_on: []
    prompt: What statistical models should be used to predict fighter outcomes? Include
      a detailed explanation of the models and their inputs.
